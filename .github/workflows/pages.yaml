name: Documentation and GitHub Pages
on:
  push:
    branches: [main, codex/initial-single-winner-examples]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
      - name: Verify counting engines, standalone examples, and HTTP contract
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/test_typescript.ts
          python3 scripts/check_parity.py
      - name: Verify generated examples and API contract stay current
        run: |
          python3 scripts/generate_docs.py
          python3 scripts/generate_openapi.py
          git diff --exit-code -- examples site
      - name: Install pinned Docapella
        run: ./scripts/install-docapella.sh
      - name: Build documentation
        run: python3 scripts/build.py
      - name: Check generated site
        run: python3 scripts/check.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: site/_build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
