name: Documentation and GitHub Pages
on:
  push:
    branches: [main, codex/initial-single-winner-examples, codex/initial-multi-winner-examples]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check native Go engines and tooling
        working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Verify counting engines, standalone examples, and HTTP contract
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/test_typescript.ts
          node tests/test_family_api.ts
          node --test tests/test_comparison.mjs
          node --test tests/test_simulator.mjs
          python3 scripts/check_parity.py
          node tests/test_multi_typescript.ts
          python3 scripts/check_multi_parity.py
          python3 scripts/check_go_parity.py
      - name: Check TypeScript engine types
        run: npm_config_ignore_scripts=true npx --yes --package typescript@5.9.3 tsc -p typescript/tsconfig.json
      - name: Verify generated examples and API contract stay current
        run: |
          python3 scripts/generate_docs.py
          python3 scripts/generate_openapi.py
          git diff --exit-code -- examples site
          test -z "$(git ls-files --others --exclude-standard -- examples site)"
      - name: Install pinned Docapella
        run: ./scripts/install-docapella.sh
      - name: Build documentation
        run: python3 scripts/build.py
      - name: Check generated site
        run: |
          python3 scripts/check.py
          node tests/test_browser_engine.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: site/_build
  go-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.12'
          cache: false
      - name: Verify the minimum supported Go version
        working-directory: go
        run: |
          go vet ./...
          go test ./...
          GOARCH=386 CGO_ENABLED=0 go test ./...
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
